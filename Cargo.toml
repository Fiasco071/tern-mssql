[package]
name = "tern-mssql"
version = "0.1.0"
edition = "2024"
description = "A SQL Server client for Tern, drawn as native Tern surfaces."
license = "MIT"

[dependencies]
tern-sdk = "0.1.0"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio = { version = "1", features = ["rt", "net", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-core = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
